<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UET Navigator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map" role="application" aria-label="UET Lahore campus map"></div>

  <!-- left: assistant -->
  <aside class="panel glass" id="panel">
    <header class="brand">
      <div class="logo" aria-hidden="true">U</div>
      <div class="brand-text">
        <h1>UET Navigator</h1>
        <p>Main Campus · GT Road, Lahore</p>
      </div>
      <button class="icon-btn" id="collapseBtn" type="button" title="Collapse panel" aria-label="Collapse panel">▾</button>
    </header>

    <div class="panel-body" id="panelBody">
      <div class="notice" id="notice">Prototype map: building positions are illustrative until surveyed on campus.</div>

      <form class="ask" id="askForm" autocomplete="off">
        <div class="ask-row">
          <input id="askInput" type="text" placeholder="Ask anything… “where is the library?”" aria-label="Ask a question">
          <button type="button" class="mic" id="micBtn" title="Speak your question" aria-label="Speak your question">🎤</button>
          <button type="submit" class="go" aria-label="Ask">Go</button>
        </div>
        <ul class="suggest" id="suggest" hidden></ul>
      </form>

      <div class="quick" id="quick">
        <button data-q="Where is the library?">📚 Library</button>
        <button data-q="Nearest cafeteria">🍽️ Nearest food</button>
        <button data-q="CS department to main gate">🏫 CS → Gate</button>
        <button data-q="Nearest mosque">🕌 Mosque</button>
        <button data-q="Give me a campus tour">🧭 Tour</button>
        <button data-q="What can I reach within 5 minutes?">⏱ 5 min</button>
      </div>

      <section class="origin">
        <label for="fromSelect">You are at</label>
        <div class="origin-row">
          <select id="fromSelect"></select>
          <button id="gpsBtn" type="button" title="Use my device location">📍 Locate me</button>
        </div>
        <small>…or tap anywhere on the map and choose “Start here”.</small>
      </section>

      <details class="filters">
        <summary>Filter places on map</summary>
        <div class="chips" id="chips"></div>
      </details>

      <section class="log" id="log" aria-live="polite"></section>
    </div>
  </aside>

  <!-- right: controls + place drawer -->
  <div class="right" id="right">
    <div class="dock glass" id="dock">
      <div class="seg" role="group" aria-label="Map style" id="basemapSeg">
        <button type="button" data-base="illus" aria-pressed="true">Illustrated</button>
        <button type="button" data-base="street" aria-pressed="false">Street</button>
        <button type="button" data-base="sat" aria-pressed="false">Satellite</button>
      </div>
      <div class="dock-icons">
        <button class="icon-btn" id="tourBtn" type="button" title="Freshers' tour" aria-label="Freshers' tour">🧭</button>
        <button class="icon-btn" id="reachBtn" type="button" title="What's within a walk?" aria-pressed="false" aria-label="Walking range">⏱</button>
        <button class="icon-btn" id="aboutBtn" type="button" title="About UET" aria-label="About UET">ⓘ</button>
        <button class="icon-btn" id="themeBtn" type="button" title="Day / night" aria-label="Toggle day and night">🌙</button>
      </div>
    </div>

    <div class="reachcard glass" id="reachCard" hidden>
      <div class="reach-head"><strong>Walking range</strong><span id="reachMin">5 min</span></div>
      <input type="range" id="reachRange" min="1" max="12" value="5" aria-label="Minutes of walking">
      <p id="reachSummary" class="meta"></p>
    </div>

    <aside class="drawer glass" id="drawer" hidden aria-label="Place details"></aside>
  </div>

  <!-- bottom: route HUD and tour -->
  <div class="hud glass" id="hud" hidden></div>
  <div class="tourbar glass" id="tourbar" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <!-- about -->
  <div class="modal" id="aboutModal" hidden>
    <div class="modal-card glass" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
      <button class="icon-btn modal-x" id="aboutClose" type="button" aria-label="Close">✕</button>
      <div id="aboutBody"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/campus-data.js"></script>
  <script src="js/campus-info.js"></script>
  <script src="js/router.js"></script>
  <script src="js/nlp.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
